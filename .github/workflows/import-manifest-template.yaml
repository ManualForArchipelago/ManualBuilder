name: Import Manifest Template from Manual

# scheduled weekly on Sunday morning EST, and allow running manually (no trailing args to dispatch is allowed by GA syntax)
on:
  schedule:
    - cron: "00 11 * * SUN"
      timezone: "America/New_York"
  workflow_dispatch:

env:
  TEMPLATE_REQUEST_URL: https://raw.githubusercontent.com/ManualForArchipelago/Manual/refs/heads/main/templates/archipelago.json
  TEMPLATE_DESTINATION: templates/archipelago.json

permissions:
  contents: write
  pull-requests: write

jobs:
  copy_manifest_template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this Repo
        uses: actions/checkout@v4
        with:
          path: .
      - name: Download raw manifest template JSON from Manual repo
        run: |
          wget -O archipelago.json ${{ env.TEMPLATE_REQUEST_URL }}
      - name: Check if the template was changed
        run: |
          set +e
          touch ${{ env.TEMPLATE_DESTINATION }}
          echo "Comparing existing template (if any) to incoming template..."
          cmp --silent ${{ env.TEMPLATE_DESTINATION }} archipelago.json
          echo "DIFFERENCES_FOUND=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Check if the template is valid JSON
        run: |
          set +e
          cat archipelago.json | jq empty > /dev/null 2>&1
          echo "INVALID_JSON=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Move new file to destination if valid and has changes
        if: env.DIFFERENCES_FOUND == 1 && env.INVALID_JSON == 0
        run: |
          mv archipelago.json ${{ env.TEMPLATE_DESTINATION }}
      - name: Create Pull Request
        id: cpr
        if: env.DIFFERENCES_FOUND == 1 && env.INVALID_JSON == 0
        uses: peter-evans/create-pull-request@v8
        with:
            branch: template
            title: Update manifest template
            add-paths: 'templates'
            author_name: 'GitHub Actions'
            author_email: 'actionrunner@veryrealandnotmadeupdomain.com'
            committer: 'GitHub Actions <actionrunner@veryrealandnotmadeupdomain.com>'
            reviewers: '${{ github.actor }}' 
      - name: Auto-Approve Pull Request
        if: ${{ steps.cpr.outputs.pull-request-number }}
        uses: hmarr/auto-approve-action@v4
        with:
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
